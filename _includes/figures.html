<figure class="site-figure {% if include.align %}align-{{ include.align }}{% endif %}">
  <img 
    src="{{ include.src | relative_url }}" 
    alt="{{ include.alt | default: include.caption | default: 'Image' }}" 
    {% if include.width %}style="max-width: {{ include.width }};"{% endif %}
    loading="lazy"
  />
  {% if include.caption %}
    <figcaption>{{ include.caption }}</figcaption>
  {% endif %}
</figure>
